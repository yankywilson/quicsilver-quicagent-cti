<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">Operation QUICSILVER / QUICAgent threat intelligence</title>
  <desc id="d">Abstract dark banner: a stream of identical UDP packets flows from a disk-shaped container toward a silent server node, with the repository title on the left.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.55" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc9f0"/>
      <stop offset="0.5" stop-color="#c0c8d8"/>
      <stop offset="1" stop-color="#ff4d6d"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5fa"/>
      <stop offset="0.5" stop-color="#aeb8c8"/>
      <stop offset="1" stop-color="#e6ebf3"/>
    </linearGradient>
    <radialGradient id="node" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4d6d" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ff4d6d" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#4cc9f0" fill-opacity="0.07"/>
    </pattern>
    <style>
      .pkt { animation: flow 4s linear infinite; }
      @keyframes flow { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(360px); opacity: 0; } }
      .glow { animation: breathe 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes breathe { 0%, 100% { transform: scale(0.85); opacity: 0.7; } 50% { transform: scale(1.12); opacity: 1; } }
      .mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace; }
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif; }
      @media (prefers-reduced-motion: reduce) { .pkt, .glow { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#dots)"/>

  <!-- container (VHD) -->
  <g transform="translate(700,120)">
    <rect x="0" y="0" width="92" height="120" rx="10" fill="#0e1628" stroke="#4cc9f0" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="14" y="16" width="64" height="8" rx="2" fill="#4cc9f0" fill-opacity="0.35"/>
    <rect x="14" y="32" width="44" height="8" rx="2" fill="#4cc9f0" fill-opacity="0.25"/>
    <circle cx="46" cy="84" r="20" fill="none" stroke="#4cc9f0" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="46" cy="84" r="4" fill="#4cc9f0" fill-opacity="0.7"/>
    <text x="46" y="142" class="mono" font-size="12" fill="#8fa3bf" text-anchor="middle">.vhd</text>
  </g>

  <!-- lane -->
  <line x1="800" y1="180" x2="1160" y2="180" stroke="#4cc9f0" stroke-opacity="0.15" stroke-width="18" stroke-linecap="round"/>
  <!-- identical 1,280-byte packets -->
  <g fill="url(#silver)">
    <rect class="pkt" x="800" y="173" width="22" height="14" rx="2" style="animation-delay:0s"/>
    <rect class="pkt" x="800" y="173" width="22" height="14" rx="2" style="animation-delay:0.5s"/>
    <rect class="pkt" x="800" y="173" width="22" height="14" rx="2" style="animation-delay:1s"/>
    <rect class="pkt" x="800" y="173" width="22" height="14" rx="2" style="animation-delay:1.5s"/>
    <rect class="pkt" x="800" y="173" width="22" height="14" rx="2" style="animation-delay:2s"/>
    <rect class="pkt" x="800" y="173" width="22" height="14" rx="2" style="animation-delay:2.5s"/>
    <rect class="pkt" x="800" y="173" width="22" height="14" rx="2" style="animation-delay:3s"/>
    <rect class="pkt" x="800" y="173" width="22" height="14" rx="2" style="animation-delay:3.5s"/>
  </g>
  <text x="980" y="214" class="mono" font-size="12" fill="#8fa3bf" text-anchor="middle">UDP/443 · 1,280 B · 1,280 B · 1,280 B …</text>

  <!-- silent server node -->
  <circle class="glow" cx="1190" cy="180" r="56" fill="url(#node)"/>
  <circle cx="1190" cy="180" r="16" fill="#0b1020" stroke="#ff4d6d" stroke-width="2"/>
  <text x="1190" y="252" class="mono" font-size="12" fill="#ff8fa3" text-anchor="middle">RAT CA · no reply</text>

  <!-- title block -->
  <text x="64" y="108" class="mono" font-size="15" fill="#4cc9f0" letter-spacing="3">ANCHOR · TLP:CLEAR · 2026-10-15</text>
  <text x="62" y="176" class="sans" font-size="64" font-weight="800" fill="url(#silver)">QUICSILVER</text>
  <rect x="64" y="194" width="520" height="4" rx="2" fill="url(#bar)"/>
  <text x="64" y="232" class="sans" font-size="22" fill="#e6edf3">QUICAgent — a Go HTTP/3-over-QUIC backdoor</text>
  <text x="64" y="262" class="sans" font-size="18" fill="#8fa3bf">Strategic · operational · tactical intelligence · reverse engineering</text>
  <text x="64" y="288" class="sans" font-size="18" fill="#8fa3bf">SOC detections · threat hunts · December 2025 → August 2026</text>
</svg>
