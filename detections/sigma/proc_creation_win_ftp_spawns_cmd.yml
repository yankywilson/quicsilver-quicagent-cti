title: FTP.EXE Spawns CMD.EXE
id: bbbf5d19-b8a1-4300-8b6f-8ae4c11ab92b
status: experimental
description: |
    ftp.exe runs '!' shell escapes through cmd.exe. QUICSILVER's ftp script uses '!call copy /Y /b' and '!start' to rebuild and launch the implant.
    Evidence tag: CORROBORATED (see docs/09-methodology-and-corrections.md).
references:
    - https://github.com/yankywilson/quicsilver-quicagent-cti
    - https://www.seqrite.com/blog/operation-quicsilver-china-nexus-actor-targets-myanmar-diplomats-via-vhd-delivered-go-backdoor/
author: ANCHOR / Colonel Yanky Wilson
date: 2026-10-15
tags:
    - attack.execution
    - attack.t1059.003
    - attack.defense-evasion
    - attack.t1202
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith: '\ftp.exe'
        Image|endswith: '\cmd.exe'
    condition: selection
falsepositives:
    - Interactive admin use of '!' inside ftp.exe
level: high
